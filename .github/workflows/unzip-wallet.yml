name: Extract wallet.zip

on:
  workflow_dispatch:

jobs:
  unzip:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip wallet.zip
        run: |
          set -e

          test -f wallet.zip
          unzip -o wallet.zip -d .
          rm -f wallet.zip
